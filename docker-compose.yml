version: '3.12'

services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5357:5357"
    env_file:
      - .env 
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: